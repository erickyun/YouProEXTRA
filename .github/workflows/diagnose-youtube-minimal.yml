name: Diagnose YouTube Crash (Minimal IPA)

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct URL to a clean decrypted, unmodified YouTube IPA'
        required: true
        type: string
      deb_url:
        description: 'Direct URL to HideChannelMembers 0.2.0 .deb (custom-only mode)'
        required: false
        type: string
      mode:
        description: 'Create an unmodified baseline or custom .deb-only IPA'
        type: choice
        required: true
        default: custom-only
        options:
          - baseline
          - custom-only
      bundle_id:
        description: 'Bundle ID for custom-only build'
        default: com.google.ios.youtubezz
        required: true
        type: string

permissions:
  contents: read

jobs:
  minimal-ipa:
    runs-on: macos-15
    steps:
      - name: Download and verify clean YouTube IPA
        shell: bash
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          echo "::add-mask::$IPA_URL"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 30 --output youtube.ipa "$IPA_URL"
          unzip -tqq youtube.ipa
          unzip -Z1 youtube.ipa | grep -Eq '^Payload/[^/]+[.]app/Info[.]plist$'
          echo 'Base IPA ZIP integrity verified.'

      - name: Download and verify only the custom .deb
        if: inputs.mode == 'custom-only'
        shell: bash
        env:
          DEB_URL: ${{ inputs.deb_url }}
        run: |
          if [ -z "$DEB_URL" ]; then
            echo '::error::deb_url is required for custom-only mode.'
            exit 1
          fi
          echo "::add-mask::$DEB_URL"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 30 --output custom.deb "$DEB_URL"
          ar t custom.deb | grep -q '^control[.]tar[.]'
          ar t custom.deb | grep -q '^data[.]tar[.]'
          echo 'Custom Debian package verified.'

      - name: Install cyan injector
        if: inputs.mode == 'custom-only'
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Prepare unmodified baseline IPA
        if: inputs.mode == 'baseline'
        run: cp youtube.ipa YouTube_Diagnostic_Baseline.ipa

      - name: Inject custom .deb only (no YouProEXTRA additional tweaks)
        if: inputs.mode == 'custom-only'
        shell: bash
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          cyan -i youtube.ipa -o YouTube_Diagnostic_CustomOnly.ipa -uwesf custom.deb -n 'YouTube Diagnose' -b "$BUNDLE_ID"
          unzip -tqq YouTube_Diagnostic_CustomOnly.ipa
          echo 'Only custom.deb was provided to cyan; no bundled extras.'

      - name: Upload diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: youtube-diagnostic-${{ inputs.mode }}
          path: YouTube_Diagnostic_*.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Job Summary
        run: |
          echo '### YouTube Crash Diagnosis' >> "$GITHUB_STEP_SUMMARY"
          echo 'Mode: `${{ inputs.mode }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sign the generated IPA using ESign, then test launch before adding any other tweaks.' >> "$GITHUB_STEP_SUMMARY"
